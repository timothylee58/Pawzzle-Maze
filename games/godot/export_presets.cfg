[preset.0]
name="GamePix"
platform="Web"
runnable=true
custom_features=""
export_filter="all_resources"
include_filter=""
exclude_filter="*test*.gd,Sprites/generate_sprites.gd,Sprites/validate_sprites.gd,Sprites/GenerateSprites.tscn,Sprites/ValidateSprites.tscn,Sprites/Preview.tscn,Sprites/preview.png,addons/godot_mcp/*"
export_path="../../dist/gamepix/index.html"
script_export_mode=2

[preset.0.options]
custom_template/debug=""
custom_template/release=""
variant/extensions_support=false
variant/thread_support=false
vram_texture_compression/for_desktop=false
vram_texture_compression/for_mobile=false
html/custom_html_shell="res://addons/gpx-godot-plugin/index.html"
html/head_include=""
html/canvas_resize_policy=2
html/focus_canvas_on_start=true
html/experimental_virtual_keyboard=false
progressive_web_app/enabled=false
