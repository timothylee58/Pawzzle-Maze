name: Validate scaffold
on:
  push:
  pull_request:
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: node tools/sync-godot-campaign.mjs --check
      - run: node --test tests/gamepix-platform.test.mjs
      - run: npm run check
      - run: npx playwright install --with-deps chromium --only-shell
      - run: npm run test:browser
